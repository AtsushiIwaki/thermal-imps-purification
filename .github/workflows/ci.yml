name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config
      - name: Check native tools on macOS
        if: runner.os == 'macOS'
        run: xcrun --find clang && cmake --version
      - name: Install Rust
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Build
        run: cargo build --locked --all-targets
      - name: Verify
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/verify.py routine
          cargo test --locked --doc
          python3 scripts/smoke.py target/debug/solve "$RUNNER_TEMP/thermal-imps-smoke"
          git diff --exit-code -- Cargo.lock
