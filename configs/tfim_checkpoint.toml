# First invocation. Choose unused JSON/HDF5 destinations before running again.
[model]
type = "tfim"
j = 1.0
g = 0.7

[evolution]
dtau = 0.01
beta_max = 0.1
record_every_beta = 0.06

[truncation]
epsilon = 1e-12
max_bond = 32

[run]
canonicalize_every = 3

[output]
path = "results/tfim-checkpoint-part1.json"
include_exact = true

[checkpoint]
path = "results/tfim-checkpoint-part1.h5"
every_steps = 4
