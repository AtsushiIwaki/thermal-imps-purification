# Continue the latest complete state from tfim_checkpoint.toml into new files.
[model]
type = "tfim"
j = 1.0
g = 0.7

[evolution]
dtau = 0.01
beta_max = 0.2
record_every_beta = 0.06

[truncation]
epsilon = 1e-12
max_bond = 32

[run]
canonicalize_every = 3

[output]
path = "results/tfim-checkpoint-part2.json"
include_exact = true

[checkpoint]
path = "results/tfim-checkpoint-part2.h5"
every_steps = 4

[restart]
path = "results/tfim-checkpoint-part1.h5"
# snapshot = 1  # Optional snapshot index; omission selects latest complete snapshot.
